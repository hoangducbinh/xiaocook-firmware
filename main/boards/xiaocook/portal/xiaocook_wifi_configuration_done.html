<!DOCTYPE html>
<html lang="vi">
<head>
    <title>XiaoCook · Kết nối thành công</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style>
        :root {
            --bg-grad-1: #eef2ff;
            --bg-grad-2: #e0f2fe;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-muted: #64748b;
            --success: #16a34a;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(15, 23, 42, 0.04);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-grad-1: #0b1220;
                --bg-grad-2: #111827;
                --surface: #1e293b;
                --border: #334155;
                --text: #e2e8f0;
                --text-muted: #94a3b8;
                --success: #4ade80;
                --shadow: 0 12px 34px rgba(0, 0, 0, 0.45);
            }
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            overflow: auto;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
            background: linear-gradient(160deg, var(--bg-grad-1), var(--bg-grad-2));
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            max-height: 100vh;
            padding: 24px;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 40px 36px;
            max-width: 360px;
            width: 100%;
        }

        .checkmark {
            width: 110px;
            height: 110px;
            margin-bottom: 24px;
        }
        .checkmark__circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke: var(--success);
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }
        .checkmark__check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            stroke: var(--success);
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards;
        }

        @keyframes stroke {
            to { stroke-dashoffset: 0; }
        }

        .message {
            text-align: center;
        }
        .message .primary {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 6px;
        }
        .message .secondary {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0;
        }
    
        /* XiaoCook: iPhone-inspired device setup. */
        :root { color-scheme:light; --accent:#007aff; --accent-hover:#0066d6;
          --accent-soft:#007aff10; --bg-grad-1:#fff; --bg-grad-2:#fff;
          --surface:#fff; --surface-muted:#f2f2f7; --border:#e5e5ea;
          --border-strong:#c7c7cc; --text:#1c1c1e; --text-muted:#6c6c70;
          --danger:#c9342d; --success:#248a3d; --radius:20px; --radius-sm:12px;
          --shadow:none; }
        body { margin:0; padding:28px 24px 32px; background:#fff;
          font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; }
        .page { max-width:400px; }
        .app-header { justify-content:space-between; margin:0 0 40px; }
        .app-header .logo { display:none; }
        .brand { font-size:17px; font-weight:650; letter-spacing:-.4px; }
        .brand small,.language-switch { display:none; }
        .app-header:after { content:"THIẾT LẬP"; color:#8e8e93; font-size:10px; font-weight:600; letter-spacing:1.5px; }
        .intro { text-align:center; margin:0 0 30px; }
        .setup-icon { display:flex; align-items:center; justify-content:center;
          width:76px; height:76px; border-radius:21px; margin:0 auto 25px;
          color:white; background:linear-gradient(155deg,#3ca6ff,#0068ee);
          box-shadow:0 8px 22px #007aff24; }
        .setup-icon svg { width:44px; height:44px; }
        .eyebrow,.steps { display:none; }
        .intro h1 { font-size:30px; line-height:1.15; font-weight:700;
          letter-spacing:-.9px; margin:0 0 13px; }
        .intro p { font-size:15px; line-height:1.5; color:#6c6c70; margin:0 auto; max-width:310px; }
        .card { background:transparent; border:0; box-shadow:none; overflow:visible; }
        .tabs { padding:3px; border:0; background:#eeeef0; border-radius:10px; gap:2px; }
        .tab { padding:8px 6px; border-radius:8px; color:#6c6c70; font-size:12px; font-weight:500; }
        .tab.active { background:#fff; color:#1c1c1e; box-shadow:0 1px 3px #0002; }
        .tab-content { padding:24px 0 0; }
        h3 { font-size:12px; text-transform:uppercase; font-weight:500; letter-spacing:.3px; color:#6c6c70; margin-bottom:12px; }
        label { font-size:13px; color:#48484a; margin-bottom:8px; }
        input[type=text],input[type=password],input[type=url],select {
          border:0; border-radius:12px; background-color:#f2f2f7; padding:15px 14px;
          color:#1c1c1e; font-size:16px; }
        input::placeholder { color:#8e8e93; }
        input[type=submit] { min-height:50px; border-radius:14px; color:#fff; font-size:16px; font-weight:600; margin-top:5px; }
        input:focus-visible,button:focus-visible,a:focus-visible { outline:3px solid #007aff55; outline-offset:2px; }
        #ap_list { border-top:0; margin-top:24px; padding-top:0; }
        #ap_list>p { color:#6c6c70; font-size:12px; margin:0 0 10px; }
        #ap_list a { border:0; border-radius:0; margin:0; padding:16px 14px;
          background:#f2f2f7; color:#1c1c1e; border-bottom:1px solid #dedee3; font-size:14px; }
        #ap_list a:first-of-type { border-radius:14px 14px 0 0; }
        #ap_list a:last-child { border-radius:0 0 14px 14px; border-bottom:0; }
        #ap_list a:only-of-type { border-radius:14px; }
        #ap_list a:hover { background:#e9e9ef; }
        .switch-row { background:#f2f2f7; border:0; border-radius:12px; }
        .portal-footer { color:#8e8e93; text-align:center; font-size:11px; line-height:1.6; margin:25px auto 0; max-width:320px; }
        .container { min-height:calc(100svh - 60px); height:auto; max-height:none; padding:16px; }
        .container .card { background:#f2f2f7; border-radius:24px; }
        .checkmark { width:80px; height:80px; }
        .message .primary { font-size:25px; line-height:1.2; letter-spacing:-.6px; margin-top:14px; }
        .message .secondary { line-height:1.5; }
        @media(max-width:360px) { body { padding:22px 18px; } .app-header { margin-bottom:28px; }
          .setup-icon { width:64px; height:64px; border-radius:18px; margin-bottom:20px; }
          .intro h1 { font-size:28px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <svg class="checkmark" viewBox="0 0 52 52">
                <circle class="checkmark__circle" cx="26" cy="26" r="25" stroke-width="2"/>
                <path class="checkmark__check" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
            </svg>

            <div class="message">
                <p class="secondary">XiaoCook · Sẵn sàng cho cuộc trò chuyện mới</p>
                <p class="primary" id="message">XiaoCook đã kết nối Wi-Fi!</p>
            </div>
        </div>
    </div>
    
    <script>
        window.addEventListener('load', function() {
            const params = new URLSearchParams(window.location.search);
            const message = params.get('message') || 'XiaoCook đã kết nối Wi-Fi!';
            document.title = message;
            document.getElementById('message').textContent = message;

            // Send exit request after a short delay
            setTimeout(function() {
                fetch('/exit', {
                    method: 'POST'
                })
                .then(response => {
                    if (response.ok) {
                        console.log('Exit config mode request sent');
                    } else {
                        console.error('Failed to send exit request');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
            }, 1000);
        });
    </script>
</body>
</html>
